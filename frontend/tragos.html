<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tragos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/manifest-tragos.json">
  <meta name="theme-color" content="#FF9900">

  <link rel="apple-touch-icon" href="/icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tragos">

  <meta name="mobile-web-app-capable" content="yes">
</head>
<body class="panel-body">

<div class="panel-container">

  <div class="panel-header">
    <div class="panel-title-wrap">
      <h1 class="panel-title">🍹 TRAGOS</h1>
      <p class="panel-subtitle">Preparación de tragos del pedido</p>
    </div>
    <div class="panel-badge">Sector</div>
    <button onclick="cerrarSesion()">🚪 Cerrar sesión</button>
  </div>

  <div class="panel-section">
    <h2 class="panel-section-title">Pedidos pagados pendientes</h2>
    <div id="pedidos"></div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCeSa8_KjYq0BjIv1hEpxNUs-jpffKhbIY",
  authDomain: "brawery-orange.firebaseapp.com",
  projectId: "brawery-orange",
  storageBucket: "brawery-orange.firebasestorage.app",
  messagingSenderId: "937233603823",
  appId: "1:937233603823:web:fee3377fd43e72c2818f1a"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);

firebase.auth().onAuthStateChanged((user) => {
  if (!user) {
    localStorage.setItem("volverDespuesLogin", "tragos.html");
    window.location.href = "login.html";
    return;
  }

  const email = user.email || "";

  const usuariosPermitidos = [
    "tragos@orange.com",
    "admin@orange.com"
  ];

  if (!usuariosPermitidos.includes(email)) {
    alert("Acceso denegado. Esta pantalla es solo para tragos.");
    firebase.auth().signOut();
    return;
  }

  console.log("✅ Usuario autorizado tragos:", email);
});
firebase.firestore().enablePersistence({ synchronizeTabs: true })
  .catch((err) => {
    console.log("Persistencia offline no disponible:", err);
  });

const contenedor = document.getElementById("pedidos");

function getEmojiSabor(sabor) {
  if (!sabor) return "";

  if (sabor.toLowerCase().includes("frutos rojos")) return "🫐";
  if (sabor.toLowerCase().includes("frutilla")) return "🍓";
  if (sabor.toLowerCase().includes("ananá")) return "🍍";
  if (sabor.toLowerCase().includes("maracuyá")) return "🥭";
  if (sabor.toLowerCase().includes("limón")) return "🍋";

  return "";
}

function obtenerItemsPedido(data) {
  if (Array.isArray(data.items) && data.items.length > 0) {
    return data.items;
  }

  const items = [];
  const pedidoViejo = data.pedido || {};

  for (let nombre in pedidoViejo) {
    const item = pedidoViejo[nombre] || {};

    items.push({
      nombre: nombre,
      cantidad: Number(item.cantidad || 0),
      precio: Number(item.precio || 0),
      subtotal: Number(item.precio || 0) * Number(item.cantidad || 0),
      sector: item.sector || "",
      productoId: item.productoId || "",
      automatico: item.automatico === true
    });
  }

  return items;
}

function renderProductos(data) {
  const items = obtenerItemsPedido(data);
  let html = "";

  items.forEach((item) => {
    if (item.sector === "tragos") {
      let nombreMostrar = item.nombre;
      let emojiBase = "";
      let emojiSabor = "";

      const partes = item.nombre.split(" - ");
      const base = partes[0];
      const sabor = partes[1];

      if (base.includes("Caipira")) emojiBase = "🍸";
      if (base.includes("Daiquiri")) emojiBase = "🍹";
      if (base.includes("Fernet")) emojiBase = "🥃";
      if (base.includes("Gin")) emojiBase = "🍹";
      if (base.includes("Aperol")) emojiBase = "🧡";

      emojiSabor = getEmojiSabor(sabor);

      if (emojiBase || emojiSabor) {
        nombreMostrar = `${emojiBase}${emojiSabor} ${item.nombre}`;
      }

      html += `<li>${nombreMostrar} x${item.cantidad}</li>`;
    }
  });

  return html;
}

db.collection("pedidos")
  .where("estado.caja", "==", "pagado")
  .where("estado.tragos", "in", ["pendiente", "en_preparacion"])
  .orderBy("fecha", "desc")
  .limit(40)
  .onSnapshot((snapshot) => {
    contenedor.innerHTML = "";

    if (snapshot.empty) {
      contenedor.innerHTML = `<div class="panel-card"><p>No hay pedidos pendientes de tragos.</p></div>`;
      return;
    }

    snapshot.forEach((doc) => {
      const data = doc.data();

      if (!data.estado) return;

      const htmlProductos = renderProductos(data);
      if (!htmlProductos) return;

      const div = document.createElement("div");
      div.className = "panel-card";

      let botones = "";
      if (data.estado.tragos === "pendiente") {
        botones = `<button onclick="preparar('${doc.id}')">🍹 Preparar</button>`;
      } else if (data.estado.tragos === "en_preparacion") {
        botones = `<button onclick="listo('${doc.id}')">✅ Listo</button>`;
      }

      div.innerHTML = `
        <h3>Pedido ${data.numeroPedido || "-"}${data.nombreCliente ? " · " + data.nombreCliente : ""}</h3>
        <p>Estado tragos: ${data.estado.tragos}</p>
        <ul>${htmlProductos}</ul>
        ${botones}
      `;

      contenedor.appendChild(div);
    });
  }, (error) => {
    console.log("ERROR ESCUCHANDO TRAGOS:", error);
    contenedor.innerHTML = `<div class="panel-card"><p>Error al cargar pedidos de tragos.</p></div>`;
  });

function preparar(id) {
  db.collection("pedidos").doc(id).update({
    "estado.tragos": "en_preparacion"
  })
  .then(() => {
    console.log("Trago en preparación");
  })
  .catch((error) => {
    console.error("Error al marcar trago en preparación:", error);
    alert("Error al marcar trago en preparación");
  });
}

function listo(id) {
  db.collection("pedidos").doc(id).update({
    "estado.tragos": "listo"
  })
  .then(() => {
    console.log("Trago listo");
  })
  .catch((error) => {
    console.error("Error al marcar trago listo:", error);
    alert("Error al marcar trago como listo");
  });
}
function cerrarSesion() {
  firebase.auth().signOut()
    .then(() => {
      localStorage.removeItem("volverDespuesLogin");
      window.location.href = "inicio.html";
    });
}
</script>

</body>
</html>
