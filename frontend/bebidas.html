<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Bebidas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/manifest-bebidas.json">
  <meta name="theme-color" content="#FF9900">

  <link rel="apple-touch-icon" href="/icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bebidas">

  <meta name="mobile-web-app-capable" content="yes">
</head>
<body class="panel-body">

<div class="panel-container">

  <div class="panel-header">
    <div class="panel-title-wrap">
      <h1 class="panel-title">🧃 BEBIDAS</h1>
      <p class="panel-subtitle">Preparación de bebidas y despacho</p>
    </div>
    <div class="panel-badge">Sector</div>
    <button onclick="cerrarSesion()">🚪 Cerrar sesión</button>
  </div>

  <div class="panel-section">
    <h2 class="panel-section-title">Pedidos pagados pendientes</h2>
    <div id="pedidos"></div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCeSa8_KjYq0BjIv1hEpxNUs-jpffKhbIY",
  authDomain: "brawery-orange.firebaseapp.com",
  projectId: "brawery-orange",
  storageBucket: "brawery-orange.firebasestorage.app",
  messagingSenderId: "937233603823",
  appId: "1:937233603823:web:fee3377fd43e72c2818f1a"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);

firebase.auth().onAuthStateChanged((user) => {
  if (!user) {
    localStorage.setItem("volverDespuesLogin", "bebidas.html");
    window.location.href = "login.html";
    return;
  }

  const email = user.email || "";

  const usuariosPermitidos = [
    "bebidas@orange.com",
    "admin@orange.com"
  ];

  if (!usuariosPermitidos.includes(email)) {
    alert("Acceso denegado. Esta pantalla es solo para bebidas.");
    firebase.auth().signOut();
    return;
  }

  console.log("✅ Usuario autorizado bebidas:", email);
});

firebase.firestore().enablePersistence({ synchronizeTabs: true })
  .catch((err) => {
    console.log("Persistencia offline no disponible:", err);
  });

const contenedor = document.getElementById("pedidos");

function obtenerItemsPedido(data) {
  if (Array.isArray(data.items) && data.items.length > 0) {
    return data.items;
  }

  const items = [];
  const pedidoViejo = data.pedido || {};

  for (let nombre in pedidoViejo) {
    const item = pedidoViejo[nombre] || {};

    items.push({
      nombre: nombre,
      cantidad: Number(item.cantidad || 0),
      precio: Number(item.precio || 0),
      subtotal: Number(item.precio || 0) * Number(item.cantidad || 0),
      sector: item.sector || "",
      productoId: item.productoId || "",
      automatico: item.automatico === true
    });
  }

  return items;
}

function renderProductos(data) {
  const items = obtenerItemsPedido(data);
  let html = "";

  items.forEach((item) => {
    if (item.sector === "bebidas") {
      let nombreMostrar = item.nombre;

      if (item.nombre.includes("Balde con hielo")) {
        nombreMostrar = "🧊 " + item.nombre;
      } else if (
        item.nombre.includes("Heineken") ||
        item.nombre.includes("Stella") ||
        item.nombre.includes("Miller") ||
        item.nombre.includes("Imperial") ||
        item.nombre.includes("Andes") ||
        item.nombre.includes("Patagonia") ||
        item.nombre.includes("Corona")
      ) {
        nombreMostrar = "🍺 " + item.nombre;
      } else if (
        item.nombre.includes("Santa Julia") ||
        item.nombre.includes("Cordero con piel de lobo") ||
        item.nombre.includes("Colon") ||
        item.nombre.includes("DV Catena") ||
        item.nombre.includes("Nicasia")
      ) {
        nombreMostrar = "🍷 " + item.nombre;
      } else if (
        item.nombre.includes("Coca") ||
        item.nombre.includes("Sprite") ||
        item.nombre.includes("Fanta") ||
        item.nombre.includes("Agua")
      ) {
        nombreMostrar = "🥤 " + item.nombre;
      } else if (item.nombre.includes("Jugo")) {
        nombreMostrar = "🍹 " + item.nombre;
      }

      html += `<li>${nombreMostrar} x${item.cantidad}</li>`;
    }
  });

  return html;
}

db.collection("pedidos")
  .where("estado.caja", "==", "pagado")
  .where("estado.bebidas", "in", ["pendiente", "en_preparacion"])
  .orderBy("fecha", "desc")
  .limit(40)
  .onSnapshot((snapshot) => {
    contenedor.innerHTML = "";

    if (snapshot.empty) {
      contenedor.innerHTML = `<div class="panel-card"><p>No hay pedidos pendientes de bebidas.</p></div>`;
      return;
    }

    snapshot.forEach((doc) => {
      const data = doc.data();

      if (!data.estado) return;

      const htmlProductos = renderProductos(data);
      if (!htmlProductos) return;

      const div = document.createElement("div");
      div.className = "panel-card";

      let botones = "";
      if (data.estado.bebidas === "pendiente") {
        botones = `<button onclick="preparar('${doc.id}')">🧃 Preparar</button>`;
      } else if (data.estado.bebidas === "en_preparacion") {
        botones = `<button onclick="listo('${doc.id}')">✅ Listo</button>`;
      }

      div.innerHTML = `
        <h3>Pedido ${data.numeroPedido || "-"}${data.nombreCliente ? " · " + data.nombreCliente : ""}</h3>
        <p>Estado bebidas: ${data.estado.bebidas}</p>
        <ul>${htmlProductos}</ul>
        ${botones}
      `;

      contenedor.appendChild(div);
    });
  }, (error) => {
    console.log("ERROR ESCUCHANDO BEBIDAS:", error);
    contenedor.innerHTML = `<div class="panel-card"><p>Error al cargar pedidos de bebidas.</p></div>`;
  });

function preparar(id) {
  db.collection("pedidos").doc(id).update({
    "estado.bebidas": "en_preparacion"
  })
  .then(() => {
    console.log("Bebidas en preparación");
  })
  .catch((error) => {
    console.error("Error al marcar bebidas en preparación:", error);
    alert("Error al marcar bebidas en preparación");
  });
}

function listo(id) {
  db.collection("pedidos").doc(id).update({
    "estado.bebidas": "listo"
  })
  .then(() => {
    console.log("Bebidas listas");
  })
  .catch((error) => {
    console.error("Error al marcar bebidas listas:", error);
    alert("Error al marcar bebidas como listas");
  });
}
function cerrarSesion() {
  firebase.auth().signOut()
    .then(() => {
      localStorage.removeItem("volverDespuesLogin");
      window.location.href = "inicio.html";
    });
}
</script>

</body>
</html>
