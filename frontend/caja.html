function obtenerItemsPedido(data) {
  if (Array.isArray(data.items) && data.items.length > 0) {
    return data.items;
  }

  const items = [];
  const pedidoViejo = data.pedido || {};

  for (let nombre in pedidoViejo) {
    const item = pedidoViejo[nombre] || {};

    items.push({
      nombre: nombre,
      cantidad: Number(item.cantidad || 0),
      precio: Number(item.precio || 0),
      subtotal: Number(item.precio || 0) * Number(item.cantidad || 0),
      sector: item.sector || "",
      productoId: item.productoId || "",
      automatico: item.automatico === true
    });
  }

  return items;
}

function renderPedido(data) {
  const items = obtenerItemsPedido(data);
  let html = "";

  items.forEach((item) => {
    html += `<li>${item.nombre} x${item.cantidad}</li>`;
  });

  return html;
}

function obtenerFechaTextoLocal() {
  const hoy = new Date();
  const anio = hoy.getFullYear();
  const mes = String(hoy.getMonth() + 1).padStart(2, "0");
  const dia = String(hoy.getDate()).padStart(2, "0");
  return `${anio}-${mes}-${dia}`;
}

function normalizarTexto(texto) {
  return String(texto || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .trim();
}

function encontrarProductoBasePorNombreVenta(nombreProductoVenta, productosLista) {
  const nombreNormalizado = normalizarTexto(nombreProductoVenta);

  // 1) Buscar coincidencia exacta primero
  let productoEncontrado = productosLista.find((producto) => {
    return normalizarTexto(producto.nombre) === nombreNormalizado;
  });

  if (productoEncontrado) return productoEncontrado;

  // 2) Buscar por prefijo cuando el pedido tiene variantes con sabores
  // Ej: "Pizza entera - Rucula" => "Pizza"
  // Ej: "Caipira - Frutos rojos" => "Caipira"
  // Ej: "Daiquiri - Frutilla" => "Daiquiri"
  productoEncontrado = productosLista.find((producto) => {
    const nombreBase = normalizarTexto(producto.nombre);
    return nombreNormalizado === nombreBase || nombreNormalizado.startsWith(nombreBase + " ");
  });

  if (productoEncontrado) return productoEncontrado;

  // 3) Buscar por casos especiales tipo " - "
  const nombreAntesGuion = nombreNormalizado.split(" - ")[0].trim();

  if (nombreAntesGuion) {
    productoEncontrado = productosLista.find((producto) => {
      const nombreBase = normalizarTexto(producto.nombre);
      return nombreBase === nombreAntesGuion;
    });
  }

  if (productoEncontrado) return productoEncontrado;

  // 4) Buscar por inclusión, por si hay variantes más largas
  productoEncontrado = productosLista.find((producto) => {
    const nombreBase = normalizarTexto(producto.nombre);
    return nombreNormalizado.includes(nombreBase);
  });

  return productoEncontrado || null;
}

async function construirDetalleGananciaVenta(dataPedidoCompleto) {
  const itemsPedido = obtenerItemsPedido(dataPedidoCompleto);
  const items = [];

  let totalVenta = 0;
  let totalCosto = 0;
  let totalGanancia = 0;

  if (itemsPedido.length === 0) {
    return { items, totalVenta, totalCosto, totalGanancia };
  }

  const productosLista = productosCacheCaja;

  itemsPedido.forEach((itemPedido) => {
    const nombreProducto = itemPedido.nombre || "";
    const cantidad = Number(itemPedido.cantidad || 0);
    const sector = itemPedido.sector || "";
    const precioPedidoUnitario = Number(itemPedido.precio || 0);

    const productoBase = itemPedido.productoId
      ? productosLista.find(p => p.id === itemPedido.productoId)
      : encontrarProductoBasePorNombreVenta(nombreProducto, productosLista);

    const costoUnitario = productoBase ? Number(productoBase.costo || 0) : 0;
    const precioVentaUnitario = precioPedidoUnitario;
    const gananciaUnitaria = precioVentaUnitario - costoUnitario;

    const subtotalVenta = precioVentaUnitario * cantidad;
    const subtotalCosto = costoUnitario * cantidad;
    const subtotalGanancia = gananciaUnitaria * cantidad;

    totalVenta += subtotalVenta;
    totalCosto += subtotalCosto;
    totalGanancia += subtotalGanancia;

    items.push({
      nombre: nombreProducto,
      sector: sector,
      cantidad: cantidad,
      precioVentaUnitario: precioVentaUnitario,
      costoUnitario: costoUnitario,
      gananciaUnitaria: gananciaUnitaria,
      subtotalVenta: subtotalVenta,
      subtotalCosto: subtotalCosto,
      subtotalGanancia: subtotalGanancia,
      productoBaseId: productoBase ? productoBase.id : null,
      productoBaseNombre: productoBase ? (productoBase.nombre || "") : ""
    });
  });

  return { items, totalVenta, totalCosto, totalGanancia };
}

async function cobrar(id) {
  try {
    const doc = await db.collection("pedidos").doc(id).get();

    if (!doc.exists) {
      alert("Pedido no encontrado");
      return;
    }

    const data = doc.data();

    if (!data.estado || data.estado.caja !== "pendiente") {
      alert("Este pedido ya fue procesado");
      return;
    }

    const ventaExistente = await db.collection("ventas_caja")
      .where("pedidoId", "==", id)
      .limit(1)
      .get();

    if (!ventaExistente.empty) {
      alert("Este pedido ya tiene una venta registrada");
      return;
    }

    const fechaTexto = obtenerFechaTextoLocal();
    const detalleGanancia = await construirDetalleGananciaVenta(data);
    const medioPago = data.pago === "transferencia"
  ? "transferencia"
  : data.pago === "tarjeta"
    ? "tarjeta"
    : "efectivo";

    await db.collection("pedidos").doc(id).update({
      "estado.caja": "pagado",
      estadoPago: "pagado",
      fechaConfirmacionPago: firebase.firestore.FieldValue.serverTimestamp()
    });

    await db.collection("ventas_caja").add({
      pedidoId: id,
      numeroPedido: data.numeroPedido || 0,
      nombreCliente: data.nombreCliente || "",
      total: data.total || 0,
      medioPago: medioPago,
      comprobanteUrl: data.comprobanteUrl || null,
      fecha: firebase.firestore.FieldValue.serverTimestamp(),
      fechaTexto: fechaTexto,
      estado: "cobrado",
      cierreId: null,
      items: detalleGanancia.items,
      totalVenta: detalleGanancia.totalVenta,
      totalCosto: detalleGanancia.totalCosto,
      totalGanancia: detalleGanancia.totalGanancia
    });

    console.log("Pago confirmado:", id);
  } catch (error) {
    console.log("ERROR AL COBRAR:", error);
    alert("Error al cobrar");
  }
}

  "estado.caja": "rechazado",

  "estado.cocina": "cancelado",

  "estado.tragos": "cancelado",

});

    console.log("Pedido rechazado:", id);
  } catch (error) {
    console.log("ERROR AL RECHAZAR PEDIDO:", error);
    alert("Error al rechazar pedido");
  }
}

async function sumarProductosAPendienteGeneral(productosNuevos, cierreId, fechaTexto) {
  const ref = db.collection("pedidos_central").doc("pendiente_general");

  await db.runTransaction(async (transaction) => {
    const doc = await transaction.get(ref);

    let productosActuales = {};

    if (doc.exists) {
      const data = doc.data();
      productosActuales = data.productos || {};
    }

    for (let producto in productosNuevos) {
      const cantidadNueva = Number(productosNuevos[producto].cantidad || 0);
      const sector = productosNuevos[producto].sector || "";

      if (!productosActuales[producto]) {
        productosActuales[producto] = {
          cantidad: 0,
          sector: sector
        };
      }

      productosActuales[producto].cantidad += cantidadNueva;
      productosActuales[producto].sector = sector;
    }

    transaction.set(ref, {
      productos: productosActuales,
      estadoEnvio: "pendiente",
      ultimoCierreId: cierreId,
      ultimaFechaTexto: fechaTexto,
      fechaActualizacion: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  });
}
async function cerrarCaja() {
  const nombreCajero = document.getElementById("nombreCajero").value.trim();
  const montoEnviado = parseFloat(document.getElementById("montoEnviado").value);
  const fechaTexto = obtenerFechaTextoLocal();

  if (!nombreCajero) {
    alert("Ingresá el nombre del cajero");
    return;
  }

  if (isNaN(montoEnviado) || montoEnviado < 0) {
    alert("Ingresá el monto enviado");
    return;
  }

  try {
    const snapshotVentas = await db.collection("ventas_caja")
      .where("cierreId", "==", null)
      .get();

    if (snapshotVentas.empty) {
      alert("No hay ventas pendientes para cerrar");
      return;
    }

    let totalEfectivo = 0;
    let totalTransferencia = 0;
    let totalTarjeta = 0;

    let totalCostoGeneral = 0;
    let totalGananciaGeneral = 0;

    const ventasPendientes = [];
    const productosAgrupados = {};

    snapshotVentas.forEach((doc) => {
      const data = doc.data();

      if (data.medioPago === "transferencia") {
        totalTransferencia += Number(data.total || 0);
      } else if (data.medioPago === "tarjeta") {
        totalTarjeta += Number(data.total || 0);
      } else {
        totalEfectivo += Number(data.total || 0);
      }

      const items = Array.isArray(data.items) ? data.items : [];

      items.forEach((item) => {
        const nombre = item.nombre || "";
        if (!nombre) return;

        const cantidad = Number(item.cantidad || 0);
        const precioUnitario = Number(item.precioVentaUnitario || item.precio || 0);

        const productoBase = item.productoBaseId
          ? productosCacheCaja.find(p => p.id === item.productoBaseId)
          : item.productoId
            ? productosCacheCaja.find(p => p.id === item.productoId)
            : encontrarProductoBasePorNombreVenta(nombre, productosCacheCaja);

        const costoUnitario = productoBase ? Number(productoBase.costo || 0) : 0;
        const subtotalCosto = costoUnitario * cantidad;
        const subtotalGanancia = (precioUnitario - costoUnitario) * cantidad;

        totalCostoGeneral += subtotalCosto;
        totalGananciaGeneral += subtotalGanancia;

        if (!productosAgrupados[nombre]) {
          productosAgrupados[nombre] = {
            cantidad: 0,
            sector: item.sector || ""
          };
        }

        productosAgrupados[nombre].cantidad += cantidad;
      });

      ventasPendientes.push({
        id: doc.id,
        data: data
      });
    });

    const cierreRef = await db.collection("cierres_caja").add({
      fechaTexto,
      nombreCajero,
      montoEnviado,
      totalEfectivoSistema: totalEfectivo,
      totalTransferenciaSistema: totalTransferencia,
      totalTarjetaSistema: totalTarjeta,
      totalGeneralSistema: totalEfectivo + totalTransferencia + totalTarjeta,
      totalCostoSistema: totalCostoGeneral,
      totalGananciaSistema: totalGananciaGeneral,
      montoContadoCentral: null,
      diferencia: null,
      estadoControl: "pendiente",
      fecha: firebase.firestore.FieldValue.serverTimestamp()
    });

    const promesas = [];

    promesas.push(
      sumarProductosAPendienteGeneral(
        productosAgrupados,
        cierreRef.id,
        fechaTexto
      )
    );

    ventasPendientes.forEach((venta) => {
      promesas.push(
        db.collection("ventas_caja").doc(venta.id).update({
          cierreId: cierreRef.id
        })
      );
    });

    promesas.push(
      db.collection("configuracion").doc("caja_actual").set({
        ultimoNumeroPedido: 0
      }, { merge: true })
    );

    await Promise.all(promesas);

    alert("Caja cerrada correctamente");
    document.getElementById("nombreCajero").value = "";
    document.getElementById("montoEnviado").value = "";

  } catch (error) {
    console.log("ERROR AL CERRAR CAJA:", error);
    alert("Error al cerrar caja");
  }
}

    });

  } catch (error) {

    console.log("ERROR AL MARCAR ENTREGADO:", error);
    alert("Error al marcar entregado");
  }
}
